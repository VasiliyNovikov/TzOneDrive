name: Bounded factory mock

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Synthetic scenario; never enables real delivery
        type: choice
        required: true
        default: pass
        options:
          - pass
          - navigation-failure
          - missing-camera
          - fallback
          - transient
          - no-progress

permissions:
  contents: read

jobs:
  mock:
    if: >-
      github.repository == 'VasiliyNovikov/TzOneDrive' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Simulate only; fixed action and experiment bounds
        env:
          MOCK_SCENARIO: ${{ inputs.scenario }}
        run: node factory/main.mjs mock --scenario "$MOCK_SCENARIO" --max-actions 50 --experiment-ms 60000
